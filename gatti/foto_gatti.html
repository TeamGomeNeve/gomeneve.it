<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stelline Nascenti - I Nostri Coach</title>
    <style>
        :root {
            --primary-yellow: #FFD700;
            --yellow-glow: rgba(255, 215, 0, 0.4);
            --dark-bg: #101010;
            --card-bg: #1a1a1a;
            --text-white: #ffffff;
            --text-black: #000000;
            --transition: 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-white);
            line-height: 1.6;
        }

        header {
            background-color: rgba(16, 16, 16, 0.95);
            padding: 15px 5%;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 4px solid var(--primary-yellow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px var(--yellow-glow);
        }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px 10vh 20px;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), var(--dark-bg);
            background-size: cover;
            background-position: center;
            transition: background-image 0.4s ease;
        }

        .hero h1 {
            font-size: clamp(3rem, 8vw, 5rem);
            color: var(--primary-yellow);
            text-transform: uppercase;
            font-weight: 900;
            text-shadow: 2px 2px 0px rgba(217, 147, 7, 0.6);
        }

        .back-btn {
            background-color: var(--primary-yellow);
            color: var(--text-black);
            padding: 8px 15px;
            font-weight: 800;
            text-decoration: none;
            text-transform: uppercase;
            transition: var(--transition);
        }

        .back-btn:hover {
            filter: brightness(1.2);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--primary-yellow);
            letter-spacing: 2px;
            text-align: center;
        }
    </style>
</head>

<body>
    
    <header>
        <a href="../index.html" class="back-btn">← Home</a>
        <div class="logo">FOTO DI GATTI</div>
        <div style="width: 80px;"></div>
    </header>

    <section id="home" class="hero">
        <h1>FOTO DI GATTI</h1>
    </section>

    <script src="script.js"></script>

</body>

</html>
